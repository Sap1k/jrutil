[project]
name = "post-scorer"
version = "0.1.0"
description = "Offline labels, features and training for the JrUtil stop-post estimator"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "polars>=1.20",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
